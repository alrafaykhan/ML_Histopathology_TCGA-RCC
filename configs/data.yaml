seed: 42

paths:
  root: ~/ML_Histopathology_TCGA-RCC
  raw_wsi: ~/ML_Histopathology_TCGA-RCC/data/raw
  cohort: data/cohort.csv
  manifests: data/manifests
  splits: data/splits
  patch_export: ~/ML_Histopathology_TCGA-RCC/patch_export/10x
  coords: ~/ML_Histopathology_TCGA-RCC/coords/10x
  thumbnails: ~/ML_Histopathology_TCGA-RCC/qc/thumbnails
  slide_qc: data/qc/slide_qc.csv
  features: ~/ML_Histopathology_TCGA-RCC/features
  hf_home: ~/hf_cache
  results: results
  reports: reports
  logs: logs
  mlflow_uri: sqlite:///mlflow.db

gdc:
  projects: [TCGA-KIRC, TCGA-KIRP, TCGA-KICH]
  sample_types:
    "01": tumor
    "11": normal
  labels:
    TCGA-KIRC: ccRCC
    TCGA-KIRP: pRCC
    TCGA-KICH: chRCC
    normal: Normal

tracks:
  order: [B, C, A]  # B = TCGA FFPE (DX), C = CPTAC FFPE (IDC), A = TCGA frozen (TS/BS)
  classes:
    A: [ccRCC, pRCC, chRCC, Normal]
    B: [ccRCC, pRCC, chRCC]  # only 12 FFPE normals from one site; FFPE normals come from CPTAC
    C: [ccRCC, Normal]  # trained together with B as the FFPE 4-class task
  slides_per_patient_class: 1
  frozen_subset:  # Track A = frozen slides paired with selected FFPE tumours + frozen normals
    tumor_per_class: {ccRCC: 150, pRCC: 150, chRCC: all}
    normal_per_project: 50
    priority: data/manifests/frozen_priority.txt  # frozen slides already downloaded

cptac:
  collection: cptac_ccrcc  # NCI Imaging Data Commons, DICOM-WSI, CC BY 4.0
  project: CPTAC-CCRCC
  labels: {tumor: ccRCC, Normal: Normal}
  priority: data/manifests/cptac_pilot.csv  # pilot series already downloaded

splits:
  test_frac: 0.2
  n_folds: 5
  site_test_frac: 0.2  # target fraction of each class's TCGA patients in held-out sites

download:
  batch_gb: 20

streaming:
  max_raw_gb: 40  # download (~0.45 MB/s) is far slower than tiling, so a small buffer suffices
  min_free_margin_gb: 30
  min_free_windows_d_gb: 10
  stop_if_wsl_free_below_gb: 60
  workers: 4
  delete_raw_after_export: true

qc:
  min_tissue_frac_per_patch: 0.5
  max_pen_frac: 0.5
  min_blur_laplacian_var: 0  # calibrated on the first batch; 0 records without excluding

tiling:
  target_mpp: 1.0
  patch_size: 224
  max_patches_per_slide: 1000
  min_patches_per_slide: 50
  jpeg_quality: 90

loader:
  num_workers: 4

gpu:
  temp_pause_c: 85
  temp_resume_c: 75
  monitor_interval_s: 60
  vram_fraction: 0.85
