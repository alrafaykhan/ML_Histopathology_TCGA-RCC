seed: 42

paths:
  root: ~/ML_Histopathology_TCGA-RCC
  raw_wsi: ~/ML_Histopathology_TCGA-RCC/data/raw
  cohort: data/cohort.csv
  manifests: data/manifests
  splits: data/splits
  patch_export: ~/ML_Histopathology_TCGA-RCC/patch_export/10x
  coords: ~/ML_Histopathology_TCGA-RCC/coords/10x
  thumbnails: ~/ML_Histopathology_TCGA-RCC/qc/thumbnails
  slide_qc: data/qc/slide_qc.csv
  features: ~/ML_Histopathology_TCGA-RCC/features
  hf_home: ~/hf_cache
  results: results
  reports: reports
  logs: logs
  mlflow_uri: sqlite:///mlflow.db

gdc:
  projects: [TCGA-KIRC, TCGA-KIRP, TCGA-KICH]
  sample_types:
    "01": tumor
    "11": normal
  labels:
    TCGA-KIRC: ccRCC
    TCGA-KIRP: pRCC
    TCGA-KICH: chRCC
    normal: Normal

tracks:
  order: [A, B]  # A = frozen (TS/BS), B = FFPE (DX); downloaded in this order
  classes:
    A: [ccRCC, pRCC, chRCC, Normal]
    B: [ccRCC, pRCC, chRCC]  # only 12 FFPE normals from one site; kept in cohort, not trained
  slides_per_patient_class: 1

download:
  batch_gb: 20

streaming:
  max_raw_gb: 100  # min(100, free_wsl_gb - 170), floor 30; set in Phase 0
  min_free_margin_gb: 30
  min_free_windows_d_gb: 10
  stop_if_wsl_free_below_gb: 60
  workers: 4
  delete_raw_after_export: true

qc:
  min_tissue_frac_per_patch: 0.5
  max_pen_frac: 0.5
  min_blur_laplacian_var: 0  # calibrated on the first batch; 0 records without excluding

tiling:
  target_mpp: 1.0
  patch_size: 224
  max_patches_per_slide: 1000
  min_patches_per_slide: 50
  jpeg_quality: 90

loader:
  num_workers: 4

gpu:
  temp_pause_c: 85
  temp_resume_c: 75
  monitor_interval_s: 60
